[tool.poetry]
name = "aio-q3-rcon"
version = "1.0.1"
description = "An async Quake 3 RCON implementation with a CLI"
authors = ["Milo Weinberg <iapetus011@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "aioq3rcon"}]
repository = "https://github.com/Iapetus-11/aio-q3-rcon"
keywords = ["quake3rcon", "quake3", "rcon", "q3", "q3rcon", "async", "asyncio"]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
asyncio-dgram = "^3.0.0"
validators = { version = "^0.35.0", optional = true }
click = { version = "^8.5.0", optional = true }

[tool.poetry.extras]
cli = ["validators", "click"]

[tool.poetry.group.dev.dependencies]
mypy = "^2.3.1"
ruff = "^0.16.8"

[tool.poetry.scripts]
q3rcon = "aioq3rcon.cli:rcon"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["aioq3rcon/**/*.py"]
python_version = "3.10"
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
strict = true
